<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7e089"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa7c11"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c222e"/>
      <stop offset="100%" stop-color="#07090c"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <!-- Gold Accent Dot -->
  <circle cx="48" cy="16" r="4.5" fill="url(#goldGrad)"/>
  <!-- Letter R -->
  <text x="13" y="47" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif" font-size="40" font-weight="900" fill="#ffffff">R</text>
  <!-- Diagonal Slash accent for Ø -->
  <line x1="23" y1="47" x2="39" y2="18" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>
</svg>
